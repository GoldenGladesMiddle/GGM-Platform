name: Deploy All Discord Bots
on:
  push:
    branches:
      - main # Change this to 'master' if that is your default branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Deploy GGM Assistant
      - name: Deploy GGM Assistant
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'apps/ggm-assistant'

      # 2. Deploy GGM Careers Bot
      - name: Deploy GGM Careers Bot
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'apps/ggm-careers'

      # 3. Deploy GGM Elevate
      - name: Deploy GGM Elevate
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'apps/ggm-elevate'

      # 4. Deploy GGM Support
      - name: Deploy GGM Support
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'apps/ggm-support'
